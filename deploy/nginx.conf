limit_req_zone $binary_remote_addr zone=iprcapi_api:10m rate=60r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name lizerun.top www.lizerun.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name lizerun.top www.lizerun.top;
    root /var/www/lizerun.top;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/lizerun.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lizerun.top/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    location /iprcapi/api/ {
        limit_req zone=iprcapi_api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
    }

    location = /iprcapi {
        return 301 /iprcapi/;
    }

    location ~ ^/iprcapi/.*\.(?:py|pyc|md)$ {
        return 404;
    }

    location /iprcapi/ {
        try_files $uri $uri/ /iprcapi/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location /deploy/ {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
